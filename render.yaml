services:
  - type: web
    name: vidyasetu
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_MOCK_APAAR
        value: "True"
      - key: AICTE_COUNCIL_REGISTRY_MOCK
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: vidyasetu-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: vidyasetu-db
          property: connectionString

databases:
  - name: vidyasetu-db
    databaseName: vidyasetu
    user: vidyasetu_user
    plan: free
